name: Release Draft

on:
  workflow_run:
    workflows: ["Build Nuitka Windows"]
    types:
      - completed

jobs:
  release-draft:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: nts-app-windows
        path: release

    - name: Create draft release and upload exe
      uses: softprops/action-gh-release@v2
      with:
        files: release/nts-app.exe
        draft: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}